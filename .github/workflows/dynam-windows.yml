name: DYNAM Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: dynam-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Enable long Windows source paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: swatinem/rust-cache@v2
        with:
          key: dynam-windows-release
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and typecheck frontend
        run: npm run build
      - name: Verify English Codex interface
        run: node --test tests/english-codex-translations.test.mjs
      - name: Verify Windows quota and launcher regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p cockpit-tools --lib --release --features quota-stack-probe --no-run --message-format=json > test-artifacts.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
          $testBinaries = @(Get-Content test-artifacts.jsonl | ForEach-Object {
            $event = $_ | ConvertFrom-Json
            if ($event.reason -eq 'compiler-artifact' -and $event.profile.test -and $event.target.name -eq 'antigravity_cockpit_tools_lib' -and $event.executable) {
              $event.executable
            }
          })
          if ($testBinaries.Count -ne 1) { throw 'Expected one library test executable' }
          $testBinary = $testBinaries[0]
          # Cargo library tests do not receive Tauri's application manifest.
          # rfd imports TaskDialogIndirect, which needs Common Controls v6.
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $manifestTool = Get-ChildItem $sdkBin -Filter mt.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$manifestTool) { throw 'Windows SDK manifest tool missing' }
          & $manifestTool.FullName -nologo -manifest src-tauri/tests/windows-test.manifest "-outputresource:$testBinary;#1"
          if ($LASTEXITCODE -ne 0) { throw 'Embedding test Common Controls manifest failed' }
          $filters = @(
            'codex_current_quota_stack_tests',
            'codex_windows_launch_preflight_tests',
            'codex_path_migration_tests',
            'codex_windows_app_server_cleanup_tests'
          )
          foreach ($filter in $filters) {
            $listed = @(& $testBinary $filter --list | Select-String ': test$')
            if ($LASTEXITCODE -ne 0 -or $listed.Count -eq 0) { throw "No tests found for $filter" }
            & $testBinary $filter --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Native regression failed: $filter" }
          }
      - name: Keep test binary for loader diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-diagnostics-${{ github.sha }}
          path: target/release/deps/antigravity_cockpit_tools_lib-*.exe
          retention-days: 3
      - name: Build personal Windows installer
        run: npx tauri build --ci --bundles nsis --config src-tauri/tauri.ci.conf.json
      - name: Collect installer and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-ChildItem target/release/bundle/nsis -Filter '*.exe' | Copy-Item -Destination artifacts
          $files = @(Get-ChildItem artifacts -File | ForEach-Object {
            @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
          })
          if ($files.Count -eq 0) { throw 'No Windows installer produced' }
          @{
            project = 'DYNAM Cockpit personal fork'
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            upstream = 'jlcodes99/cockpit-tools v1.3.43 (4089320ac78bbd7ebaabc5bb878507b292b52c01)'
            compiler = (rustc --version)
            files = $files
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: DYNAM-Cockpit-Windows-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
